<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="16 8" opacity="0.6"/>

  <!-- Academic Cap & Book Icon -->
  <g transform="translate(106, 100)">
    <!-- Graduation Cap Top -->
    <polygon points="150,30 280,95 150,160 20,95" fill="url(#accentGrad)" />
    <!-- Tassel -->
    <path d="M 240,115 L 240,180 Q 240,210 260,220" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <circle cx="260" cy="225" r="10" fill="#fbbf24" />
    <!-- Cap Skull Base -->
    <path d="M 70,125 L 70,175 Q 150,225 230,175 L 230,125" fill="#1e3a8a" stroke="#ffffff" stroke-width="6"/>

    <!-- Open Knowledge Book / Invoice Symbol -->
    <path d="M 30,220 Q 150,195 150,230 Q 150,195 270,220 L 270,270 Q 150,245 150,280 Q 150,245 30,270 Z" fill="#ffffff" />
    <path d="M 150,230 L 150,280" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Crest Monogram "SSC" -->
  <text x="256" y="440" font-family="'Segoe UI', 'Inter', sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">
    SHREE SAI
  </text>
</svg>
